services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app_templete
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel-network

  webserver:
    image: nginx:alpine
    container_name: laravel_webserver_templete
    restart: unless-stopped
    ports:
      - "8070:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - laravel-network

  db:
    image: mysql:8.0
    container_name: laravel_db_templete
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_db_templete
      MYSQL_USER: laravel_user_templete
      MYSQL_PASSWORD: laravel_password_templete
      MYSQL_ROOT_PASSWORD: root_password_templete
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin_templete
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password_templete
    ports:
      - "8081:80"
    networks:
      - laravel-network

volumes:
  dbdata:
    driver: local

networks:
  laravel-network:
    driver: bridge
