name: Laravel CI Workflow

on:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, fileinfo, mysql, bcmath

    - name: Install Composer Dependencies
      uses: ramsey/composer-install@v3

    - name: Copy .env file
      run: cp .env.example .env

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Run PHP Pint (Code Style Check)
      run: ./vendor/bin/pint --test

    - name: Run Migrations / Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: test_db
        DB_USERNAME: root
        DB_PASSWORD: password
      run: |
        php artisan migrate --force
        php artisan test


